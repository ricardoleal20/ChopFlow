[package]
name = "chopflow-proto"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Generated gRPC protobuf types for ChopFlow (shared by broker, worker, CLI, llm-worker)"
repository.workspace = true
license.workspace = true

[dependencies]
chopflow_core = { path = "../core", version = "0.1.3" }
tonic.workspace = true
prost.workspace = true
prost-types = "0.12"
serde_json.workspace = true

[build-dependencies]
tonic-build = "0.10"
# Vendored protoc so end users can build `chopflow-proto` (and thus
# `cargo install chopflow`) without a system-installed `protoc`. CI
# preinstalls protobuf-compiler, but end-user machines often don't have it.
protoc-bin-vendored = "3.2"
