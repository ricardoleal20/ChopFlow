syntax = "proto3";

package chopflow;

// Java codegen options. These are ignored by prost (the Rust build) but make
// the generated Java stubs land in a proper namespace for the Java client SDK.
option java_package = "dev.ricardoleal20.chopflow.grpc";
option java_outer_classname = "ChopFlowProto";
option java_multiple_files = true;

// Import Google's timestamp for ETA handling
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// The ChopFlow broker service
service ChopFlowBroker {
  // Task management
  rpc EnqueueTask (EnqueueTaskRequest) returns (EnqueueTaskResponse);
  rpc GetTaskStatus (GetTaskStatusRequest) returns (GetTaskStatusResponse);
  rpc CancelTask (CancelTaskRequest) returns (CancelTaskResponse);
  
  // Worker management
  rpc RegisterWorker (RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc WorkerHeartbeat (WorkerHeartbeatRequest) returns (WorkerHeartbeatResponse);
  rpc AcknowledgeTask (AcknowledgeTaskRequest) returns (AcknowledgeTaskResponse);

  // Task delivery: workers pull tasks they are capable of executing.
  // The broker matches queued tasks against the worker's tags and
  // available resources and returns up to `max_tasks` ready tasks.
  rpc FetchTasks (FetchTasksRequest) returns (FetchTasksResponse);

  // Queue stats
  rpc GetQueueStats (GetQueueStatsRequest) returns (GetQueueStatsResponse);
  rpc ListTasks (ListTasksRequest) returns (ListTasksResponse);
  rpc ListWorkers (google.protobuf.Empty) returns (ListWorkersResponse);

  // Schedule management
  rpc CreateSchedule (CreateScheduleRequest) returns (CreateScheduleResponse);
  rpc ListSchedules (ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc DeleteSchedule (DeleteScheduleRequest) returns (DeleteScheduleResponse);
}

// Task object definition
message Task {
  string id = 1;
  string name = 2;
  string payload = 3; // JSON serialized payload
  repeated string tags = 4;
  google.protobuf.Timestamp enqueue_time = 5;
  google.protobuf.Timestamp eta = 6;
  uint32 retry_count = 7;
  uint32 max_retries = 8;
  TaskStatus status = 9;
  map<string, uint32> resources = 10; // Resource requirements
  // JSON serialized result of the task once it reaches COMPLETED, or the
  // error message if it reached FAILED/DEADLETTERED. Empty until terminal.
  string result = 11;
  // Set when this task was materialized by a schedule ticker.
  string schedule_id = 12;
}

// Worker definition
message Worker {
  string id = 1;
  string address = 2;
  repeated string tags = 3;
  ResourceAvailability resources = 4;
  repeated string assigned_tasks = 5;
  google.protobuf.Timestamp last_heartbeat = 6;
}

// Resource availability for a worker
message ResourceAvailability {
  map<string, uint32> available = 1;
  map<string, uint32> total = 2;
}

// Task status enum
enum TaskStatus {
  CREATED = 0;
  QUEUED = 1;
  RUNNING = 2;
  COMPLETED = 3;
  FAILED = 4;
  DEADLETTERED = 5;
  CANCELLED = 6;
}

// EnqueueTask RPC
message EnqueueTaskRequest {
  string name = 1;
  string payload = 2; // JSON serialized payload
  repeated string tags = 3;
  google.protobuf.Timestamp eta = 4;
  uint32 max_retries = 5;
  map<string, uint32> resources = 6; // Resource requirements
}

message EnqueueTaskResponse {
  string task_id = 1;
}

// GetTaskStatus RPC
message GetTaskStatusRequest {
  string task_id = 1;
}

message GetTaskStatusResponse {
  Task task = 1;
}

// CancelTask RPC
message CancelTaskRequest {
  string task_id = 1;
}

message CancelTaskResponse {
  bool success = 1;
}

// RegisterWorker RPC
message RegisterWorkerRequest {
  string address = 1;
  repeated string tags = 2;
  map<string, uint32> resources = 3;
}

message RegisterWorkerResponse {
  string worker_id = 1;
}

// WorkerHeartbeat RPC
message WorkerHeartbeatRequest {
  string worker_id = 1;
  // Optionally include current resource availability
  ResourceAvailability resources = 2;
}

message WorkerHeartbeatResponse {
  bool success = 1;
}

// AcknowledgeTask RPC
message AcknowledgeTaskRequest {
  string worker_id = 1;
  string task_id = 2;
  bool success = 3;
  string result = 4; // JSON serialized result if success=true, error message if success=false
}

message AcknowledgeTaskResponse {
  bool success = 1;
}

// FetchTasks RPC — workers pull tasks they can execute.
message FetchTasksRequest {
  string worker_id = 1;
  // Maximum number of tasks to pull in this request.
  uint32 max_tasks = 2;
}

message FetchTasksResponse {
  repeated Task tasks = 1;
}

// GetQueueStats RPC
message GetQueueStatsRequest {}

message GetQueueStatsResponse {
  uint32 queue_length = 1;
  uint32 tasks_processing = 2;
  uint32 tasks_completed = 3;
  uint32 tasks_failed = 4;
  uint32 active_workers = 5;
}

// ListTasks RPC
message ListTasksRequest {
  uint32 limit = 1;
  uint32 offset = 2;
  repeated TaskStatus filter_status = 3;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  uint32 total_count = 2;
}

// ListWorkers RPC
message ListWorkersResponse {
  repeated Worker workers = 1;
}

// Schedule management messages

message TaskTemplate {
  string name = 1;
  string payload = 2;
  repeated string tags = 3;
  map<string, uint32> resources = 4;
  uint32 max_retries = 5;
}

enum OverlapPolicy { OVERLAP_SKIP = 0; OVERLAP_COALESCE = 1; OVERLAP_ALLOW = 2; }

message ScheduleKind {
  oneof kind {
    string cron = 1;
    google.protobuf.Timestamp eta = 2;
  }
}

message Schedule {
  string id = 1;
  string name = 2;
  TaskTemplate task_template = 3;
  ScheduleKind kind = 4;
  OverlapPolicy overlap_policy = 5;
  bool enabled = 6;
  google.protobuf.Timestamp last_fired = 7;
  google.protobuf.Timestamp next_fire = 8;
  google.protobuf.Timestamp created_at = 9;
}

message CreateScheduleRequest { Schedule schedule = 1; }
message CreateScheduleResponse { string schedule_id = 1; }
message ListSchedulesRequest {}
message ListSchedulesResponse { repeated Schedule schedules = 1; }
message DeleteScheduleRequest { string id = 1; }
message DeleteScheduleResponse { bool success = 1; }