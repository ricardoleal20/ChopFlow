[package]
name = "chopflow-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "MCP (Model Context Protocol) server exposing the ChopFlow broker as AI-friendly tools"
repository.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
# transport-streamable-http-server(-session): streamable-HTTP transport
# (axum router at /mcp) used by `--http`. stdio remains the default transport
# when the flag is absent.
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
schemars = "0.8"
axum = "0.7"
tokio-util = "0.7"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
