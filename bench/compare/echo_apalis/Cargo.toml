[package]
name = "echo_apalis"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "echo_apalis"
path = "src/main.rs"

# Kept OUT of the ChopFlow workspace so the apalis dependency tree never
# touches the main build. This is a standalone bench driver.
[workspace]
[dependencies]
apalis = { version = "0.7", features = ["retry"] }
apalis-redis = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
image = "0.25"
tower = { version = "0.5", features = ["limit"] }
