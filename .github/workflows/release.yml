name: release

# Triggered by pushing a tag like `v0.1.0`. Publishes the Rust crates to
# crates.io and the Python client to PyPI, then opens a GitHub Release with
# auto-generated notes. No binary artifacts are attached — consumers install
# from the package indexes (cargo add / pip install).
on:
  push:
    tags:
      - 'v*'

# Only one release run per tag at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # needed by github-release to create the Release

jobs:
  # 1. Guard: the tag must match the version declared in the workspace and in
  #    the Python client. Fails fast instead of publishing a mismatched build.
  verify-version:
    name: Verify tag matches declared versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag version
        id: parse
        run: |
          # tag is "v0.1.0" -> version "0.1.0"
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Parsed version: $VERSION"

      - name: Verify Rust workspace version
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          WORKSPACE_VERSION=$(grep -E '^version\s*=' Cargo.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "Workspace version: $WORKSPACE_VERSION"
          if [ "$WORKSPACE_VERSION" != "$VERSION" ]; then
            echo "::error::Tag version ($VERSION) does not match Cargo.toml workspace version ($WORKSPACE_VERSION)"
            exit 1
          fi

      - name: Verify Python client version
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          PY_VERSION=$(grep -E '^version\s*=' clients/python/pyproject.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "Python client version: $PY_VERSION"
          if [ "$PY_VERSION" != "$VERSION" ]; then
            echo "::error::Tag version ($VERSION) does not match pyproject.toml version ($PY_VERSION)"
            exit 1
          fi

  # 2. Publish the Rust crates to crates.io in dependency order. The publish is
  #    idempotent: a crate whose version already exists on crates.io is skipped
  #    (HTTP 400 "already exists" → treated as success), so a re-run of a
  #    partially-failed release resumes from where it left off instead of
  #    cascading. Path-dep versions are resolved against crates.io, so a crate
  #    cannot be published before its dependencies.
  publish-rust:
    name: Publish Rust crates to crates.io
    runs-on: ubuntu-latest
    needs: verify-version
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify CARGO_REGISTRY_TOKEN is set
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set. Create it from https://crates.io/settings/tokens"
            exit 1
          fi

      # Publish order follows the dependency graph (leaf first):
      #   core -> proto -> broker -> worker -> cli -> mcp -> llm-worker -> chopflow
      # `chopflow` (the umbrella binary crate) is published last — it depends on
      # broker, cli, and mcp. `demos` is publish = false and is skipped.
      - name: Publish crates in dependency order
        run: |
          set -uo pipefail
          VERSION="${{ needs.verify-version.outputs.version }}"

          # Check whether $1@VERSION already exists on crates.io.
          already_published() {
            local crate="$1"
            # crates.io API: GET /api/v1/crates/{name} → 200 with max_version,
            # or 404 if absent. A User-Agent is required.
            local body
            body=$(curl -fsSL -A "chopflow-release/1.0" \
                    "https://crates.io/api/v1/crates/${crate}" 2>/dev/null || true)
            if echo "$body" | grep -q "\"max_version\":\"${VERSION}\""; then
              return 0
            fi
            # Also handle the case where this exact version is present even if a
            # newer max exists (yanked/newer pre-release). We accept "already
            # exists" from cargo publish's exit as well (below).
            return 1
          }

          publish_with_retry() {
            local crate="$1"
            if already_published "$crate"; then
              echo "$crate ${VERSION} already on crates.io — skipping"
              return 0
            fi
            local attempts=0
            local max=5
            # crates.io indexing of a freshly published dependency can take a
            # few seconds; retry with backoff until the registry sees it.
            while true; do
              # Capture stderr+stdout: a 400 "already exists" means a prior run
              # published it, which we treat as success.
              if cargo publish -p "$crate" 2>&1 | tee /tmp/pub.log; then
                break
              fi
              if grep -qi "already exists\|already been published" /tmp/pub.log; then
                echo "$crate ${VERSION} already exists on crates.io — skipping"
                break
              fi
              attempts=$((attempts + 1))
              if [ "$attempts" -ge "$max" ]; then
                echo "::error::Failed to publish $crate after $max attempts"
                exit 1
              fi
              echo "Publish of $crate failed (attempt $attempts/$max), retrying in 15s..."
              sleep 15
            done
            echo "Published $crate"
            # Give crates.io a moment to index before dependents look it up.
            sleep 5
          }

          for crate in \
              chopflow_core \
              chopflow-proto \
              chopflow_broker \
              chopflow_worker \
              chopflow_cli \
              chopflow-mcp \
              chopflow-llm-worker \
              chopflow; do
            publish_with_retry "$crate"
          done

  # 3. Build the Python wheel/sdist and publish to PyPI using trusted
  #    publishing (OIDC) — no API token secret required. Requires the trusted
  #    publisher to be registered on pypi.org first (see PR description).
  publish-python:
    name: Publish Python client to PyPI
    runs-on: ubuntu-latest
    needs: verify-version
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build backend
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build
        working-directory: clients/python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist/
          skip-existing: true # idempotent: skip if this version is already on PyPI

  # 4. Open the GitHub Release with auto-generated notes. No binary artifacts
  #    are attached — everything is installed from the package indexes.
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-rust, publish-python]
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install

            **Rust — unified command** (crates.io): the `chopflow` crate installs
            a single `chopflow` binary covering the broker, CLI, and MCP server:
            ```sh
            cargo install chopflow
            ```
            ```text
            chopflow broker start     # broker (gRPC + HTTP/dashboard)
            chopflow mcp              # MCP server (AI tools, stdio)
            chopflow enqueue -f …     # enqueue a task
            chopflow schedule …       # manage schedules
            ```
            (Workers stay separate: `cargo install chopflow_worker`.)

            **Rust — individual library crates**:
            ```sh
            cargo add chopflow_core chopflow-proto chopflow_broker chopflow_worker chopflow_cli chopflow-mcp chopflow-llm-worker
            ```

            **Homebrew**:
            ```sh
            brew tap ricardoleal20/chopflow
            brew install chopflow
            ```

            **Python** (PyPI):
            ```sh
            pip install chopflow
            ```

            No binary artifacts are attached to this release. Install from the
            package indexes above.

            ---
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 5. Deploy the marketing/docs site to GitHub Pages. The release event itself
  #    does NOT trigger deploy-pages.yml: this workflow creates the Release with
  #    the default GITHUB_TOKEN, and GitHub suppresses events generated by
  #    GITHUB_TOKEN to prevent workflow loops. A workflow_dispatch API call is
  #    not subject to that suppression, so we explicitly dispatch the Pages
  #    deploy here once the Release is published.
  deploy-site:
    name: Deploy site to GitHub Pages
    runs-on: ubuntu-latest
    needs: github-release
    permissions:
      actions: write # required to dispatch deploy-pages.yml
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          echo "Dispatched deploy-pages.yml; see https://github.com/${{ github.repository }}/actions/workflows/deploy-pages.yml"

  # 6. Bump the Homebrew formula in the tap repo (ricardoleal20/homebrew-chopflow).
  #    The formula's sha256 can only be computed from the published crates.io
  #    tarball, so this runs after publish-rust. It downloads the tarball,
  #    computes the sha256, renders Formula/chopflow.rb, and pushes it to the
  #    tap repo. Requires a PAT with `repo` scope on the tap repo stored as the
  #    HOMEBREW_TAP_TOKEN secret. Skipped gracefully if the secret is absent
  #    (e.g. before the tap repo exists).
  bump-homebrew:
    name: Bump Homebrew formula
    runs-on: ubuntu-latest
    needs: [publish-rust, github-release]
    steps:
      - name: Render and push formula to tap repo
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAP_REPO="ricardoleal20/homebrew-chopflow"
          echo "Bumping Homebrew formula for chopflow $VERSION"

          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not set — skipping Homebrew formula bump. Create the tap repo ($TAP_REPO) and add the secret to enable brew install."
            exit 0
          fi

          # Download the published source tarball and compute its sha256.
          TARBALL_URL="https://crates.io/api/v1/crates/chopflow/${VERSION}/download"
          echo "Fetching $TARBALL_URL"
          curl -fsSL -A "chopflow-release/1.0" -o chopflow.crate "$TARBALL_URL"
          SHA256=$(sha256sum chopflow.crate | awk '{print $1}')
          echo "sha256=$SHA256"

          # Clone the tap repo (Formula/ convention).
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          cd tap
          mkdir -p Formula

          # Render the formula. The source build uses `cargo install --locked
          # --path .` (via std_cargo_args) against the extracted tarball; path
          # deps were rewritten to registry deps at cargo publish time.
          cat > Formula/chopflow.rb <<EOF
          class Chopflow < Formula
            desc "Durable distributed task queue built in Rust"
            homepage "https://github.com/ricardoleal20/ChopFlow"
            url "${TARBALL_URL}"
            sha256 "${SHA256}"
            license "Apache-2.0"
            version "${VERSION}"

            depends_on "rust" => :build

            def install
              system "cargo", "install", *std_cargo_args
            end

            test do
              assert_match "unified command", shell_output("#{bin}/chopflow --help")
              assert_match "broker", shell_output("#{bin}/chopflow broker --help")
              assert_match "MCP server", shell_output("#{bin}/chopflow mcp --help")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/chopflow.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged — nothing to commit"
          else
            git commit -m "chopflow ${VERSION}"
            git push
            echo "Pushed formula for chopflow ${VERSION} to ${TAP_REPO}"
          fi
