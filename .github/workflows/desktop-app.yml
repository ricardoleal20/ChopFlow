name: macOS App (dmg)

# Builds the ChopFlow desktop app (.app + .dmg) on every git tag v* and
# attaches the DMG to the GitHub Release — that's what the landing page's
# "Download the macOS App" button points at. Can also be dispatched manually
# (inputs.tag) to re-attach a DMG to an already-published release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload the built DMG to'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11 --activate
      - name: Frontend deps
        working-directory: broker/ui
        run: pnpm install --no-frozen-lockfile
      - name: Build the CLI (bundled sidecar)
        run: cargo build --release -p chopflow
      - name: Build the frontend
        working-directory: broker/ui
        run: pnpm build
      - name: Build the macOS app (app + dmg)
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build
      - name: Upload DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then RELEASE_TAG="${GITHUB_REF_NAME}"; fi
          VERSION="${RELEASE_TAG#v}"
          for f in app/src-tauri/target/release/bundle/dmg/*.dmg; do
            [ -e "$f" ] && gh release upload "$RELEASE_TAG" "$f" --clobber
          done
          for f in app/src-tauri/target/release/bundle/macos/*.app.tar.gz; do
            [ -e "$f" ] && gh release upload "$RELEASE_TAG" "$f" --clobber
          done
          echo "Uploaded dmg/app for v$VERSION to release $RELEASE_TAG"
