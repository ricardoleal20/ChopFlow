name: Deploy site to GitHub Pages

# Publish the site when a release is published (not on every push to main).
# A release is the intentional "ship the docs" moment. Manual dispatch still
# available for ad-hoc deploys.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress runs mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          # Landing page becomes the site index.
          cp docs/design/chopflow-landing.html _site/index.html
          # Documentation site, linked from the landing's Docs / Quickstart.
          cp docs/design/chopflow-docs.html _site/docs.html
          # Custom 404.
          cp docs/design/404.html _site/404.html
          # Open Graph share image, referenced by og:image meta tags.
          cp assets/opengraph.png _site/assets/opengraph.png
          # Favicon — the ChopFlow mark (German Shepherd), generated from
          # assets/icons/chopflow.svg. Served from site root.
          cp assets/icons/chopflow.ico _site/favicon.ico
          # SVG mark, referenced as the preferred vector favicon.
          mkdir -p _site/assets/icons
          cp assets/icons/chopflow.svg _site/assets/icons/chopflow.svg
          # Custom domain. Must live at the publish root.
          echo "chopflow.ricardoleal20.dev" > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
