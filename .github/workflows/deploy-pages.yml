name: Deploy site to GitHub Pages

# Publish the site when a release is published (not on every push to main).
# A release is the intentional "ship the docs" moment. Manual dispatch still
# available for ad-hoc deploys.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress runs mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Landing page becomes the site index.
          cp docs/design/chopflow-landing.html _site/index.html
          # Custom 404.
          cp docs/design/404.html _site/404.html
          # Custom domain. Must live at the publish root.
          echo "chopflow.ricardoleal20.dev" > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
