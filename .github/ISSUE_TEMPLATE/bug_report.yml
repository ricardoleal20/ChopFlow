name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill in the sections below.
        If you're unsure whether this is a bug, feel free to open a discussion instead.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, one- or two-sentence description of the bug.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of ChopFlow is affected?
      options:
        - broker
        - worker
        - cli
        - core
        - mcp
        - llm-worker
        - client-library (Python)
        - client-library (Java)
        - dashboard / UI
        - docs
        - other
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        A minimal, self-contained recipe. Include the exact commands you ran and
        any task payload / config. A reduced reproducer is hugely helpful.
      placeholder: |
        1. Start the broker with `chopflow broker start --storage memory`
        2. Enqueue a task with payload `{...}`
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Paste any error output or stack traces.
      render: shell
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Help us reproduce your setup. ChopFlow version can be obtained from
        `chopflow --version` or `cargo run -- --version`.
      placeholder: |
        - OS:
        - ChopFlow version:
        - Rust version (if building from source):
        - How you're running it (binary / cargo / Docker / Tauri app):
        - Storage backend (memory / sqlite):
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant? Workarounds you tried, related issues, screenshots.
    validations:
      required: false
