  <style>
    :root {
      color-scheme: light;
      --canvas: #f7f8fa;
      --surface: #ffffff;
      --surface-2: #f2f4f7;
      --surface-3: #e8ebf1;
      --border: #e2e6ed;
      --border-strong: #cdd4df;
      --text: #171b26;
      --text-2: #3a4150;
      --muted: #586274;
      --subtle: #848ea0;
      --navy: #141a27;
      --navy-2: #1e2637;
      --navy-3: #262f42;
      --navy-text: #ced6e6;
      --navy-strong: #f4f6fb;
      --navy-muted: #7c879e;
      --primary: #4060ff;
      --info: #3b82f6;
      --success: #22c55a;
      --danger: #ef2f2f;
      --warn: #f59e0b;
      --purple: #a855f7;
      --slate: #64748b;
      --shadow: 0 12px 36px rgba(30, 38, 55, 0.08);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --canvas: #0a0c10;
      --surface: #11141b;
      --surface-2: #171b24;
      --surface-3: #232938;
      --border: #232938;
      --border-strong: #2f3648;
      --text: #e7ebf3;
      --text-2: #b9c1d1;
      --muted: #8a93a6;
      --subtle: #5c6578;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden;
      background: var(--canvas); color: var(--text);
      font-family: var(--font-sans); font-size: 16px; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    svg { display: block; }
    ::selection { background: var(--primary); color: var(--navy-strong); }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; border-radius: 6px; }

    .bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .bg-canvas canvas { display: block; width: 100%; height: 100%; }
    .bg-veil { position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(90% 60% at 50% 45%, transparent 0%, color-mix(in srgb, var(--canvas) 70%, transparent) 100%); }

    .topbar { position: relative; z-index: 2; height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; }
    .brand-tile { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; overflow: hidden;
      background: linear-gradient(135deg, var(--primary), var(--purple)); box-shadow: 0 6px 18px rgba(64,96,255,.25); }
    .brand-tile img { width: 100%; height: 100%; display: block; }
    .wordmark { font-size: 17px; letter-spacing: -.02em; }
    .wordmark strong { font-weight: 700; }
    .wordmark span { color: var(--muted); font-weight: 500; }

    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .nav-link { padding: 0 14px; font-size: 14px; font-weight: 500; color: var(--text-2); transition: color .18s ease; }
    .nav-link:hover { color: var(--text); }
    .nav-link.gh { display: inline-flex; align-items: center; gap: 7px; }
    .nav-link.gh svg { width: 16px; height: 16px; }

    .theme-toggle {
      width: 44px; height: 44px; display: grid; place-items: center; padding: 0;
      border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);
      cursor: pointer; transition: background-color .18s ease, border-color .18s ease;
    }
    .theme-toggle:hover { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
    .theme-toggle svg { width: 19px; height: 19px; }
    .theme-toggle .sun, [data-theme="light"] .theme-toggle .moon { display: none; }
    [data-theme="light"] .theme-toggle .sun { display: block; }

    @media (max-width: 640px) {
      .nav-link:not(.gh) { display: none; }
    }

    .main { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: clamp(32px, 6vw, 64px) 24px; }

    .error-code { margin: 0 0 8px; font: 700 clamp(96px, 22vw, 180px)/.95 var(--font-mono); letter-spacing: -.04em;
      background: linear-gradient(135deg, var(--primary), #6b8bff); -webkit-background-clip: text; background-clip: text; color: transparent; }

    .kicker { margin: 0 0 16px; color: var(--muted); font: 600 12px/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }

    .headline { margin: 0 0 14px; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; letter-spacing: -.025em; font-weight: 600; }

    .body-copy { max-width: 52ch; margin: 0 0 36px; color: var(--muted); font-size: clamp(15px, 1.8vw, 17px); line-height: 1.6; }

    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .button { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      padding: 0 20px; border: 1px solid transparent; border-radius: 8px;
      font-size: 14px; font-weight: 600; letter-spacing: .01em; cursor: pointer;
      transition: transform .18s ease, background-color .18s ease, border-color .18s ease, box-shadow .18s ease; }
    .button:hover { transform: translateY(-1px); }
    .button:active { transform: scale(0.98); }
    .button svg { width: 17px; height: 17px; }
    .button-primary { background: var(--primary); color: var(--navy-strong); box-shadow: 0 8px 22px rgba(64,96,255,.22); }
    .button-primary:hover { background: #2949e6; }
    .button-ghost { border-color: var(--border-strong); background: var(--surface); color: var(--text); }
    .button-ghost:hover { border-color: var(--text-2); background: var(--surface-2); }

    .status-bar { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 16px 24px clamp(20px, 4vw, 32px); flex-wrap: wrap; }
    .status-line { display: inline-flex; align-items: center; gap: 9px; padding: 7px 14px;
      border: 1px solid var(--border); border-radius: 9999px; background: var(--surface);
      color: var(--muted); font: 500 11px/1 var(--font-mono); letter-spacing: .02em; }
    .status-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--danger);
      animation: danger-pulse 1.6s ease-out infinite; }
    @keyframes danger-pulse { 0% { box-shadow: 0 0 0 0 rgba(239,47,47,.5); } 70%,100% { box-shadow: 0 0 0 6px rgba(239,47,47,0); } }
    .status-path { color: var(--text-2); }

    @media (max-width: 480px) {
      .actions { flex-direction: column; width: 100%; max-width: 280px; }
      .actions .button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .button:hover, .button:active { transform: none; }
    }
  </style>
</head>

      <a class="button button-ghost" href="https://github.com/ricardoleal20/ChopFlow"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17 4.6 18 4.9 18 4.9c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg> View on GitHub</a>
    </div>
  </main>

  <div class="status-bar">
    <span class="status-line"><span class="status-dot"></span>dead-lettered<span class="status-path" id="path"></span></span>
  </div>

  <script>
    (() => {
      const pathEl = document.getElementById('path');
      if (pathEl) {
        const p = window.location.pathname || '/';
        pathEl.textContent = ' · ' + p;
      }
    })();

    (() => {
      const root = document.documentElement;
      const themeToggle = document.querySelector('.theme-toggle');
      if (themeToggle) {
        function syncThemeLabel() {
          const dark = root.dataset.theme === 'dark';
          themeToggle.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0a0c10' : '#f7f8fa');
        }
        syncThemeLabel();
        themeToggle.addEventListener('click', () => {
          root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
          localStorage.setItem('chopflow-theme', root.dataset.theme);
          syncThemeLabel();
        });
      }
    })();

    (() => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const canvas = document.getElementById('flow');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
      let paths = [], particles = [];
      let rafId = null;
      const DIM = 'rgba(124,135,158,0.22)';
      const PRIMARY = 'rgba(64,96,255,0.5)', INFO = 'rgba(59,130,246,0.5)';
      function buildPaths() {
        paths = [
          [[0, h * 0.28], [w * 0.5, h * 0.12], [w, h * 0.34]],
          [[0, h * 0.52], [w * 0.5, h * 0.68], [w, h * 0.46]],
          [[0, h * 0.74], [w * 0.45, h * 0.58], [w, h * 0.80]]
        ];
      }
      function bez(p, t) { const u = 1 - t; return [u*u*p[0][0] + 2*u*t*p[1][0] + t*t*p[2][0], u*u*p[0][1] + 2*u*t*p[1][1] + t*t*p[2][1]]; }
      function bezTan(p, t) { return [2*(1-t)*(p[1][0]-p[0][0]) + 2*t*(p[2][0]-p[1][0]), 2*(1-t)*(p[1][1]-p[0][1]) + 2*t*(p[2][1]-p[1][1])]; }
      function spawn() {
        particles = [];
        const count = w < 640 ? 12 : 22;
        for (let i = 0; i < count; i++) {
          const glow = Math.random() < 0.2;
          particles.push({ pi: i % paths.length, t: Math.random(), speed: 0.0004 + Math.random() * 0.0008, r: glow ? 2 : 1.2, glow, color: glow ? (Math.random() < 0.5 ? PRIMARY : INFO) : DIM });
        }
      }
      function resize() {
        w = canvas.clientWidth; h = canvas.clientHeight;
        if (w === 0 || h === 0) return;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildPaths(); spawn();
      }
      function frame() {
        if (w === 0 || h === 0) { rafId = requestAnimationFrame(frame); return; }
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) {
          p.t += p.speed;
          if (p.t > 1) p.t -= 1;
          const path = paths[p.pi];
          const pt = bez(path, p.t);
          const x = pt[0], y = pt[1];
          if (p.glow) {
            const tn = bezTan(path, p.t);
            const ang = Math.atan2(tn[1], tn[0]);
            const tl = 20;
            const isInfo = p.color === INFO;
            const grad = ctx.createLinearGradient(x - Math.cos(ang) * tl, y - Math.sin(ang) * tl, x, y);
            grad.addColorStop(0, isInfo ? 'rgba(59,130,246,0)' : 'rgba(64,96,255,0)');
            grad.addColorStop(1, isInfo ? 'rgba(59,130,246,0.4)' : 'rgba(64,96,255,0.4)');
            ctx.strokeStyle = grad; ctx.lineWidth = p.r; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(x - Math.cos(ang) * tl, y - Math.sin(ang) * tl); ctx.lineTo(x, y); ctx.stroke();
            ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 6;
            ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
          } else {
            ctx.fillStyle = DIM;
            ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI * 2); ctx.fill();
          }
        }
        rafId = requestAnimationFrame(frame);
      }
      resize();
      window.addEventListener('resize', () => { dpr = Math.min(window.devicePixelRatio || 1, 2); resize(); }, { passive: true });
      rafId = requestAnimationFrame(frame);
    })();
  </script>
</body>
