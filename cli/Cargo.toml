[package]
name = "chopflow_cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "CLI for ChopFlow distributed task queue"
repository.workspace = true
license.workspace = true

[dependencies]
chopflow_core = { path = "../core", version = "0.1.3" }
chopflow-proto = { path = "../proto", version = "0.1.3" }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tonic.workspace = true
prost-types = "0.12.0"

[dev-dependencies]
chopflow_broker = { path = "../broker", version = "0.1.3" }
chopflow_worker = { path = "../worker", version = "0.1.3" }
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
